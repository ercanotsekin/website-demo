<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saint Yux - Luxury Textile</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#fafafa;color:#2c2c2c;line-height:1.6}header{background:#fff;border-bottom:1px solid #e8e8e8;padding:20px 0;position:sticky;top:0;z-index:100}.header-container{max-width:1400px;margin:0 auto;padding:0 40px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:26px;font-weight:300;letter-spacing:3px;text-transform:uppercase}.nav-buttons{display:flex;gap:20px;align-items:center}.nav-btn{background:#000;color:#fff;border:none;padding:10px 20px;cursor:pointer;font-size:13px;letter-spacing:1px;text-transform:uppercase;transition:all .3s}.nav-btn:hover{background:#333}.cart-icon{position:relative;cursor:pointer;font-size:20px}.cart-count{position:absolute;top:-8px;right:-10px;background:#000;color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}.container{max-width:1400px;margin:0 auto;padding:0 40px}.page{display:none}.page.active{display:block}.hero{text-align:center;padding:80px 0;background:linear-gradient(135deg,#f9f9f9 0%,#fff 100%)}.hero h1{font-size:48px;font-weight:300;letter-spacing:4px;margin-bottom:15px;text-transform:uppercase}.hero p{font-size:15px;color:#888;letter-spacing:1px}.search-section{padding:40px 0;border-bottom:1px solid #e8e8e8}.search-box{width:100%;padding:15px 20px;border:1px solid #ddd;font-size:14px;background:#fff;margin-bottom:20px}.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:30px;padding:40px 0}.product-card{background:#fff;border:1px solid #e8e8e8;transition:all .3s}.product-card:hover{transform:translateY(-3px);box-shadow:0 5px 15px rgba(0,0,0,.1)}.product-image{width:100%;aspect-ratio:1;background:#f5f5f5;display:flex;align-items:center;justify-content:center;font-size:60px;overflow:hidden}.product-image img{width:100%;height:100%;object-fit:cover}.product-info{padding:20px}.product-category{font-size:11px;color:#999;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}.product-info h3{font-size:15px;font-weight:400;letter-spacing:.5px;margin-bottom:10px;text-transform:uppercase}.product-price{font-size:16px;font-weight:500;margin-bottom:15px;color:#000}.btn-add{width:100%;padding:12px;background:#000;color:#fff;border:none;cursor:pointer;font-size:12px;letter-spacing:1px;text-transform:uppercase;transition:all .3s}.btn-add:hover{background:#333}.admin-panel{padding:40px 0}.form-section{background:#fff;padding:30px;border:1px solid #e8e8e8;margin-bottom:30px}.form-section h2{font-size:20px;font-weight:300;letter-spacing:2px;margin-bottom:20px;text-transform:uppercase}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}.form-group{margin-bottom:20px}.form-group label{display:block;font-size:11px;letter-spacing:1px;margin-bottom:8px;text-transform:uppercase;color:#666;font-weight:500}.form-group input,.form-group textarea{width:100%;padding:10px;border:1px solid #ddd;font-size:14px;font-family:inherit}.form-group textarea{min-height:80px;resize:vertical}.btn-submit{background:#000;color:#fff;padding:12px 30px;border:none;cursor:pointer;font-size:12px;letter-spacing:1px;text-transform:uppercase}.btn-submit:hover{background:#333}.products-list{background:#fff;border:1px solid #e8e8e8}.product-item{padding:20px 30px;border-bottom:1px solid #e8e8e8;display:flex;justify-content:space-between;align-items:center}.product-item:last-child{border-bottom:none}.product-item-info h4{font-size:13px;font-weight:500;margin-bottom:5px;text-transform:uppercase}.product-item-price{font-size:15px;font-weight:500;margin-bottom:3px}.product-item-category{font-size:11px;color:#999}.btn-delete{background:#d32f2f;color:#fff;padding:8px 15px;border:none;cursor:pointer;font-size:11px;letter-spacing:1px;text-transform:uppercase}.btn-delete:hover{background:#b71c1c}.csv-section{background:#fff;padding:30px;border:1px solid #e8e8e8;margin-bottom:30px}.csv-section h3{font-size:18px;font-weight:300;letter-spacing:2px;margin-bottom:15px;text-transform:uppercase}.csv-info{background:#f5f5f5;padding:15px;margin-bottom:15px;font-size:13px;color:#666}.file-input{position:relative;overflow:hidden;margin:15px 0}.file-input input[type=file]{position:absolute;left:-9999px}.file-input label{display:block;padding:12px 20px;background:#000;color:#fff;cursor:pointer;font-size:12px;letter-spacing:1px;text-transform:uppercase;text-align:center}.file-input label:hover{background:#333}.btn-csv{display:inline-block;padding:10px 25px;background:#666;color:#fff;text-decoration:none;font-size:12px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:none;margin-bottom:15px}.btn-csv:hover{background:#555}@media(max-width:768px){.container{padding:0 20px}.form-grid{grid-template-columns:1fr}.products-grid{grid-template-columns:1fr}.hero h1{font-size:32px}}
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">Saint Yux</div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="showShop()">Koleksiyon</button>
                <button class="nav-btn" onclick="showAdmin()">Yönetim</button>
                <div class="cart-icon" onclick="showCart()">🛒<span class="cart-count" id="cartCount">0</span></div>
            </div>
        </div>
    </header>

    <div id="shopPage" class="page active">
        <div class="hero"><h1>Koleksiyon</h1><p>Tasarım ve kalite bir araya geldi</p></div>
        <div class="container">
            <div class="search-section">
                <input type="text" class="search-box" id="searchInput" placeholder="Ürün ara..." onkeyup="searchProducts()">
            </div>
            <div class="products-grid" id="productsGrid"></div>
        </div>
    </div>

    <div id="adminPage" class="page">
        <div class="container admin-panel">
            <div class="csv-section">
                <h3>CSV Yükle</h3>
                <div class="csv-info">Format: Ürün Adı,Fiyat,Kategori<br>Örnek: SAINT YUX T-Shirt,189,T-Shirt</div>
                <button class="btn-csv" onclick="downloadCSV()">CSV Şablonunu İndir</button>
                <div class="file-input">
                    <label for="csvFile">📁 CSV Dosyası Seç</label>
                    <input type="file" id="csvFile" accept=".csv" onchange="uploadCSV(event)">
                </div>
            </div>

            <div class="form-section">
                <h2>Yeni Ürün Ekle</h2>
                <form id="productForm" onsubmit="addProduct(event)">
                    <div class="form-grid">
                        <div class="form-group"><label>Ürün Adı</label><input type="text" id="productName" required></div>
                        <div class="form-group"><label>Fiyat (TL)</label><input type="number" id="productPrice" required min="1"></div>
                    </div>
                    <div class="form-group"><label>Kategori</label><input type="text" id="productCategory"></div>
                    <div class="form-group"><label>Fotoğraf Yükle (PNG/JPG)</label><input type="file" id="productImage" accept="image/*"></div>
                    <button type="submit" class="btn-submit">Ürün Ekle</button>
                </form>
            </div>

            <div class="form-section">
                <h2>Ürünler</h2>
                <div class="products-list" id="productsList"></div>
            </div>
        </div>
    </div>

    <script>
        let products = [
            {id:1,name:"SAINT YUX Bej Rengi Keten Karışımlı Bol Kesim Pantolon",price:1349,category:"Pantolon",image:null},
            {id:2,name:"SAINT YUX Kadın Bele Oturan Geniş Kollu Doğal Bluz",price:349,category:"Bluz",image:null},
            {id:3,name:"SAINT YUX Futbol Baskılı Çocuk Takımı 2 Parça",price:309,category:"Çocuk",image:null},
            {id:4,name:"SAINT YUX Rafadan Tayfa Alt Üst Takım",price:510,category:"Çocuk",image:null},
            {id:5,name:"SAINT YUX 92 numara çocuk alt üst eşofman takımı",price:600,category:"Çocuk",image:null},
            {id:6,name:"SAINT YUX Yazlık Brooklyn Usa Ny Baskılı Erkek T-Shirt",price:349,category:"T-Shirt",image:null},
            {id:7,name:"SAINT YUX Kadın Bele Oturan Geniş Kollu T-Shirt",price:349,category:"T-Shirt",image:null}
        ];
        let cart = [];

        function showShop(){document.getElementById('shopPage').classList.add('active');document.getElementById('adminPage').classList.remove('active');displayShopProducts(products);}
        function showAdmin(){document.getElementById('shopPage').classList.remove('active');document.getElementById('adminPage').classList.add('active');displayAdminProducts();}
        
        function loadProducts(){const stored=localStorage.getItem('products');if(stored){products=JSON.parse(stored);}displayShopProducts(products);}
        
        function displayShopProducts(items){const grid=document.getElementById('productsGrid');grid.innerHTML='';items.forEach(p=>{const img=p.image?`<img src="${p.image}">':'📦';grid.innerHTML+=`<div class="product-card"><div class="product-image">${img}</div><div class="product-info"><div class="product-category">${p.category}</div><h3>${p.name}</h3><div class="product-price">${p.price} TL</div><button class="btn-add" onclick="addToCart(${p.id})">Sepete Ekle</button></div></div>`});}
        
        function displayAdminProducts(){const list=document.getElementById('productsList');if(products.length===0){list.innerHTML='<div style="padding:20px;text-align:center;color:#999">Ürün yok</div>';return;}list.innerHTML=products.map(p=>`<div class="product-item"><div><h4>${p.name}</h4><div class="product-item-price">${p.price} TL</div><div class="product-item-category">${p.category}</div></div><button class="btn-delete" onclick="deleteProduct(${p.id})">Sil</button></div>`).join('');}
        
        function addProduct(e){e.preventDefault();const fileInput=document.getElementById('productImage');if(fileInput.files.length>0){const reader=new FileReader();reader.onload=(evt)=>{const newProduct={id:Date.now(),name:document.getElementById('productName').value,price:parseInt(document.getElementById('productPrice').value),category:document.getElementById('productCategory').value||'Diğer',image:evt.target.result};products.push(newProduct);saveProducts();document.getElementById('productForm').reset();displayAdminProducts();displayShopProducts(products);alert('Ürün eklendi!')};reader.readAsDataURL(fileInput.files[0]);}else{const newProduct={id:Date.now(),name:document.getElementById('productName').value,price:parseInt(document.getElementById('productPrice').value),category:document.getElementById('productCategory').value||'Diğer',image:null};products.push(newProduct);saveProducts();document.getElementById('productForm').reset();displayAdminProducts();displayShopProducts(products);alert('Ürün eklendi!');}}
        
        function deleteProduct(id){if(confirm('Sil?')){products=products.filter(p=>p.id!==id);saveProducts();displayAdminProducts();displayShopProducts(products);}}
        
        function downloadCSV(){const csv="Ürün Adı,Fiyat,Kategori\nÖrnek Ürün,189,T-Shirt";const blob=new Blob([csv],{type:'text/csv'});const url=window.URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='sablon.csv';a.click();}
        
        function uploadCSV(e){const file=e.target.files[0];const reader=new FileReader();reader.onload=(evt)=>{const lines=evt.target.result.split('\n').slice(1);lines.forEach(line=>{if(line.trim()){const[name,price,category]=line.split(',').map(s=>s.trim());if(name&&price&&category){products.push({id:Date.now()+Math.random(),name:name,price:parseInt(price),category:category,image:null})}}});saveProducts();displayAdminProducts();displayShopProducts(products);alert('Ürünler eklendi!')};reader.readAsText(file);}
        
        function addToCart(id){const p=products.find(x=>x.id===id);cart.push(p);updateCartCount();alert(p.name+' sepete eklendi!');}
        
        function showCart(){alert(`Sepet: ${cart.length} ürün\nToplam: ${cart.reduce((sum,p)=>sum+p.price,0)} TL`);}
        
        function searchProducts(){const q=document.getElementById('searchInput').value.toLowerCase();const filtered=products.filter(p=>p.name.toLowerCase().includes(q));displayShopProducts(filtered);}
        
        function updateCartCount(){document.getElementById('cartCount').textContent=cart.length;}
        
        function saveProducts(){localStorage.setItem('products',JSON.stringify(products));}
        
        loadProducts();
    </script>
</body>
</html>
