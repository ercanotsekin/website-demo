<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saint Yux - Tekstil & Streetwear</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        header {
            background: #1a1a1a;
            color: white;
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
        }
        .header-buttons {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .btn {
            padding: 10px 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover {
            background: #ff5252;
        }
        .cart-icon {
            position: relative;
            cursor: pointer;
            font-size: 20px;
        }
        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff6b6b;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .filters {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .product {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .product:hover {
            transform: translateY(-5px);
        }
        .product-image {
            width: 100%;
            height: 250px;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }
        .product-info {
            padding: 15px;
        }
        .product-name {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 16px;
        }
        .product-price {
            color: #ff6b6b;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .product-buttons {
            display: flex;
            gap: 10px;
        }
        .btn-add {
            flex: 1;
            padding: 10px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-add:hover {
            background: #ff5252;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }
        .cart-items {
            margin-top: 20px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .cart-total {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #ff6b6b;
            font-size: 20px;
            font-weight: bold;
            text-align: right;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        .admin-panel {
            background: white;
            padding: 30px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: Arial;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .btn-primary {
            background: #ff6b6b;
            color: white;
            padding: 12px 20px;
        }
        .btn-primary:hover {
            background: #ff5252;
        }
        .btn-delete {
            background: #d32f2f;
            color: white;
            padding: 8px 15px;
            font-size: 12px;
        }
        .products-list {
            margin-top: 40px;
        }
        .product-item {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #ff6b6b;
        }
        .product-item-info {
            flex: 1;
        }
        .product-item-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        .product-item-price {
            color: #ff6b6b;
            font-weight: bold;
        }
        .product-item-actions {
            display: flex;
            gap: 10px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        h1 {
            margin-bottom: 30px;
        }
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .products {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            header .container {
                flex-direction: column;
                gap: 15px;
            }
            .product-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .product-item-actions {
                margin-top: 10px;
                width: 100%;
            }
            .btn-delete {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">🏪 Saint Yux</div>
            <div class="header-buttons">
                <button class="btn" onclick="switchPage('shop')">🛍️ Mağaza</button>
                <button class="btn" onclick="switchPage('admin')">⚙️ Yönetim</button>
                <div class="cart-icon" onclick="openCart()">
                    🛒
                    <span class="cart-count" id="cartCount">0</span>
                </div>
            </div>
        </div>
    </header>

    <main id="shopPage" class="page active">
        <div class="container">
            <div class="filters">
                <input type="text" class="search-box" id="searchInput" placeholder="Ürün ara...">
            </div>
            <div class="products" id="productsList"></div>
        </div>
    </main>

    <main id="adminPage" class="page">
        <div class="container">
            <div class="admin-panel">
                <h2>Yeni Ürün Ekle</h2>
                <form id="productForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Ürün Adı *</label>
                            <input type="text" id="productName" required>
                        </div>
                        <div class="form-group">
                            <label>Fiyat (TL) *</label>
                            <input type="number" id="productPrice" required min="1">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Açıklama</label>
                        <textarea id="productDescription"></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Kategori</label>
                            <input type="text" id="productCategory" placeholder="T-Shirt, Pantolon vb.">
                        </div>
                        <div class="form-group">
                            <label>Stok Sayısı</label>
                            <input type="number" id="productStock" value="10" min="0">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Resim (Emoji)</label>
                        <input type="text" id="productImage" placeholder="👕">
                    </div>

                    <button type="submit" class="btn btn-primary">➕ Ürün Ekle</button>
                </form>
            </div>

            <div class="products-list">
                <h2>Mevcut Ürünler</h2>
                <div id="productsList2"></div>
            </div>
        </div>
    </main>

    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🛒 Sepetim</h2>
                <button class="close-btn" onclick="closeCart()">✕</button>
            </div>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-total" id="cartTotal"></div>
        </div>
    </div>

    <script>
        let products = [];
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function switchPage(page) {
            document.getElementById('shopPage').classList.remove('active');
            document.getElementById('adminPage').classList.remove('active');
            
            if (page === 'shop') {
                document.getElementById('shopPage').classList.add('active');
            } else {
                document.getElementById('adminPage').classList.add('active');
                displayAdminProducts();
            }
        }

        function loadProducts() {
            const stored = localStorage.getItem('products');
            if (stored) {
                products = JSON.parse(stored);
            } else {
                products = [
                    { id: 1, name: "DOCE ELEGANTE Bele Oturan Bluz", price: 299, description: "Geniş kollu, rahat ve şık tasarım", category: "Bluz", stock: 15, image: "🧥" },
                    { id: 2, name: "Çocuk Fiyonklu Tişört Takım", price: 750, description: "Detaylı tişört ve eşofman 2'li takım", category: "Çocuk", stock: 12, image: "👧" },
                    { id: 3, name: "Brasil Şort Askılı Tişört Takım", price: 599, description: "Crop ve şort - Yaz koleksiyonu", category: "Alt-Üst", stock: 20, image: "🏖️" },
                    { id: 4, name: "Saint Yux Crop Top", price: 189, description: "Modern kesim, rahat taşıma", category: "T-Shirt", stock: 25, image: "👚" },
                    { id: 5, name: "Premium Eşofman Takımı", price: 450, description: "Rahat ve konforlu", category: "Pantolon", stock: 16, image: "👖" },
                    { id: 6, name: "Yazlık Tişört Koleksiyonu", price: 159, description: "Nefes alan kumaş, günlük giyim", category: "T-Shirt", stock: 30, image: "👕" },
                    { id: 7, name: "Spor Atlet", price: 129, description: "Yoga ve fitness için ideal", category: "Alt-Üst", stock: 22, image: "🏃" },
                    { id: 8, name: "Premium Denim Pantolon", price: 349, description: "Kaliteli denim kumaş", category: "Pantolon", stock: 14, image: "👖" },
                    { id: 9, name: "Casual Hoodie", price: 399, description: "Sıcak ve rahat kış giyimi", category: "Hoodie", stock: 11, image: "🧢" },
                    { id: 10, name: "Geniş Kesim Tişört", price: 179, description: "Oversize style, günlük giyim", category: "T-Shirt", stock: 28, image: "👕" }
                ];
            }
            displayShopProducts(products);
        }

        function displayShopProducts(items) {
            const list = document.getElementById('productsList');
            list.innerHTML = '';
            
            if (items.length === 0) {
                list.innerHTML = '<div class="empty-state">Ürün bulunamadı.</div>';
                return;
            }

            items.forEach(product => {
                list.innerHTML += `
                    <div class="product">
                        <div class="product-image">${product.image || '📦'}</div>
                        <div class="product-info">
                            <div class="product-name">${product.name}</div>
                            <div class="product-price">${product.price} TL</div>
                            <div class="product-buttons">
                                <button class="btn-add" onclick="addToCart(${product.id})">Sepete Ekle</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function displayAdminProducts() {
            const list = document.getElementById('productsList2');
            
            if (products.length === 0) {
                list.innerHTML = '<p style="color: #999;">Henüz ürün yok.</p>';
                return;
            }

            list.innerHTML = products.map((product) => `
                <div class="product-item">
                    <div class="product-item-info">
                        <div class="product-item-name">${product.image || '📦'} ${product.name}</div>
                        <div class="product-item-price">${product.price} TL</div>
                        ${product.category ? `<small style="color: #666;">Kategori: ${product.category}</small>` : ''}
                    </div>
                    <div class="product-item-actions">
                        <button class="btn btn-delete" onclick="deleteProduct(${product.id})">Sil</button>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('productForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const newProduct = {
                id: Date.now(),
                name: document.getElementById('productName').value,
                price: parseInt(document.getElementById('productPrice').value),
                description: document.getElementById('productDescription').value,
                category: document.getElementById('productCategory').value,
                stock: parseInt(document.getElementById('productStock').value),
                image: document.getElementById('productImage').value || '📦'
            };

            products.push(newProduct);
            saveProducts();
            document.getElementById('productForm').reset();
            displayAdminProducts();
            displayShopProducts(products);
            alert('Ürün başarıyla eklendi!');
        });

        function deleteProduct(id) {
            if (confirm('Bu ürünü silmek istediğinize emin misiniz?')) {
                products = products.filter(p => p.id !== id);
                saveProducts();
                displayAdminProducts();
                displayShopProducts(products);
                alert('Ürün silindi!');
            }
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(c => c.id === productId);
            
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({...product, quantity: 1});
            }
            
            saveCart();
            updateCartCount();
            alert(product.name + ' sepete eklendi!');
        }

        function openCart() {
            const modal = document.getElementById('cartModal');
            const cartItems = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                cartItems.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">Sepet boş</p>';
                document.getElementById('cartTotal').innerHTML = '';
            } else {
                let html = '';
                let total = 0;
                
                cart.forEach((item, i) => {
                    const itemTotal = item.price * item.quantity;
                    total += itemTotal;
                    html += `
                        <div class="cart-item">
                            <div>
                                <strong>${item.name}</strong><br>
                                ${item.price} TL × ${item.quantity}
                            </div>
                            <div>
                                <button class="btn" onclick="removeFromCart(${i})" style="background: #999;">Sil</button>
                            </div>
                        </div>
                    `;
                });
                
                cartItems.innerHTML = html;
                document.getElementById('cartTotal').innerHTML = `Toplam: <span style="color: #ff6b6b;">${total} TL</span>`;
            }
            
            modal.classList.add('active');
        }

        function closeCart() {
            document.getElementById('cartModal').classList.remove('active');
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCart();
            updateCartCount();
            openCart();
        }

        function saveProducts() {
            localStorage.setItem('products', JSON.stringify(products));
        }

        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        function updateCartCount() {
            document.getElementById('cartCount').textContent = cart.length;
        }

        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query));
            displayShopProducts(filtered);
        });

        loadProducts();
        updateCartCount();
    </script>
</body>
</html>
