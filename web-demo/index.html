<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saint Yux - Tekstil & Streetwear</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        header {
            background: #1a1a1a;
            color: white;
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
        }
        .header-buttons {
            display: flex;
            gap: 15px;
        }
        .btn {
            padding: 10px 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover {
            background: #ff5252;
        }
        .cart-icon {
            position: relative;
            cursor: pointer;
            font-size: 20px;
        }
        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff6b6b;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .filters {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .product {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .product:hover {
            transform: translateY(-5px);
        }
        .product-image {
            width: 100%;
            height: 250px;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #999;
        }
        .product-info {
            padding: 15px;
        }
        .product-name {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 16px;
        }
        .product-price {
            color: #ff6b6b;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .product-buttons {
            display: flex;
            gap: 10px;
        }
        .btn-add {
            flex: 1;
            padding: 10px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-add:hover {
            background: #ff5252;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }
        .cart-items {
            margin-top: 20px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .cart-total {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #ff6b6b;
            font-size: 20px;
            font-weight: bold;
            text-align: right;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        @media (max-width: 768px) {
            .products {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            header .container {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">🏪 Saint Yux</div>
            <div class="header-buttons">
                <a href="admin.html" class="btn">Ürün Yönetimi</a>
                <div class="cart-icon" onclick="openCart()">
                    🛒
                    <span class="cart-count" id="cartCount">0</span>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="filters">
            <input type="text" class="search-box" id="searchInput" placeholder="Ürün ara...">
        </div>

        <div class="products" id="productsList"></div>
    </main>

    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🛒 Sepetim</h2>
                <button class="close-btn" onclick="closeCart()">✕</button>
            </div>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-total" id="cartTotal"></div>
        </div>
    </div>

    <script>
        let products = [];
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        // Ürünleri yükle
        function loadProducts() {
            fetch('products.json')
                .then(res => res.json())
                .then(data => {
                    products = data;
                    displayProducts(products);
                })
                .catch(err => console.error('Ürün yükleme hatası:', err));
        }

        // Ürünleri göster
        function displayProducts(items) {
            const list = document.getElementById('productsList');
            list.innerHTML = '';
            
            if (items.length === 0) {
                list.innerHTML = '<div class="empty-state">Ürün bulunamadı.</div>';
                return;
            }

            items.forEach(product => {
                list.innerHTML += `
                    <div class="product">
                        <div class="product-image">${product.image || '📦'}</div>
                        <div class="product-info">
                            <div class="product-name">${product.name}</div>
                            <div class="product-price">${product.price} TL</div>
                            <div class="product-buttons">
                                <button class="btn-add" onclick="addToCart(${product.id})">Sepete Ekle</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Sepete ekle
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(c => c.id === productId);
            
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({...product, quantity: 1});
            }
            
            saveCart();
            updateCartCount();
            alert(product.name + ' sepete eklendi!');
        }

        // Sepeti aç
        function openCart() {
            const modal = document.getElementById('cartModal');
            const cartItems = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                cartItems.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">Sepet boş</p>';
                document.getElementById('cartTotal').innerHTML = '';
            } else {
                let html = '';
                let total = 0;
                
                cart.forEach((item, i) => {
                    const itemTotal = item.price * item.quantity;
                    total += itemTotal;
                    html += `
                        <div class="cart-item">
                            <div>
                                <strong>${item.name}</strong><br>
                                ${item.price} TL × ${item.quantity}
                            </div>
                            <div>
                                <button class="btn" onclick="removeFromCart(${i})" style="background: #999;">Sil</button>
                            </div>
                        </div>
                    `;
                });
                
                cartItems.innerHTML = html;
                document.getElementById('cartTotal').innerHTML = `Toplam: <span style="color: #ff6b6b;">${total} TL</span>`;
            }
            
            modal.classList.add('active');
        }

        // Sepeti kapat
        function closeCart() {
            document.getElementById('cartModal').classList.remove('active');
        }

        // Sepetten çıkar
        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCart();
            updateCartCount();
            openCart();
        }

        // Sepeti kaydet
        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        // Sepet sayısını güncelle
        function updateCartCount() {
            document.getElementById('cartCount').textContent = cart.length;
        }

        // Arama
        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query));
            displayProducts(filtered);
        });

        // Başlat
        loadProducts();
        updateCartCount();
    </script>
</body>
</html>
