<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saint Yux - Ürün Yönetimi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }
        header {
            background: #1a1a1a;
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: #666;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .admin-panel {
            background: white;
            padding: 30px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: Arial;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-primary {
            background: #ff6b6b;
            color: white;
        }
        .btn-primary:hover {
            background: #ff5252;
        }
        .btn-secondary {
            background: #666;
            color: white;
        }
        .btn-delete {
            background: #d32f2f;
            color: white;
            padding: 8px 15px;
            font-size: 12px;
        }
        .products-list {
            margin-top: 40px;
        }
        .product-item {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #ff6b6b;
        }
        .product-item-info {
            flex: 1;
        }
        .product-item-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        .product-item-price {
            color: #ff6b6b;
            font-weight: bold;
        }
        .product-item-actions {
            display: flex;
            gap: 10px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        h1 {
            margin-bottom: 30px;
        }
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .product-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .product-item-actions {
                margin-top: 10px;
                width: 100%;
            }
            .btn-delete {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>🏪 Saint Yux - Ürün Yönetimi</h1>
        </div>
    </header>

    <main class="container">
        <a href="index.html" class="back-btn">← Mağazaya Dön</a>

        <div class="admin-panel">
            <h2>Yeni Ürün Ekle</h2>
            <form id="productForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Ürün Adı *</label>
                        <input type="text" id="productName" required>
                    </div>
                    <div class="form-group">
                        <label>Fiyat (TL) *</label>
                        <input type="number" id="productPrice" required min="1">
                    </div>
                </div>

                <div class="form-group">
                    <label>Açıklama</label>
                    <textarea id="productDescription"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Kategori</label>
                        <input type="text" id="productCategory" placeholder="T-Shirt, Pantolon vb.">
                    </div>
                    <div class="form-group">
                        <label>Stok Sayısı</label>
                        <input type="number" id="productStock" value="10" min="0">
                    </div>
                </div>

                <div class="form-group">
                    <label>Resim (Emoji veya URL)</label>
                    <input type="text" id="productImage" placeholder="👕 veya https://...">
                </div>

                <button type="submit" class="btn btn-primary">➕ Ürün Ekle</button>
            </form>
        </div>

        <div class="products-list">
            <h2>Mevcut Ürünler</h2>
            <div id="productsList"></div>
        </div>
    </main>

    <script>
        let products = [];

        // Ürünleri yükle
        function loadProducts() {
            fetch('products.json')
                .then(res => res.json())
                .then(data => {
                    products = data;
                    displayProducts();
                })
                .catch(err => {
                    console.error('Ürün yükleme hatası:', err);
                    products = [];
                    displayProducts();
                });
        }

        // Ürünleri göster
        function displayProducts() {
            const list = document.getElementById('productsList');
            
            if (products.length === 0) {
                list.innerHTML = '<p style="color: #999;">Henüz ürün yok.</p>';
                return;
            }

            list.innerHTML = products.map((product, index) => `
                <div class="product-item">
                    <div class="product-item-info">
                        <div class="product-item-name">${product.image || '📦'} ${product.name}</div>
                        <div class="product-item-price">${product.price} TL</div>
                        ${product.category ? `<small style="color: #666;">Kategori: ${product.category}</small>` : ''}
                    </div>
                    <div class="product-item-actions">
                        <button class="btn btn-delete" onclick="deleteProduct(${product.id})">Sil</button>
                    </div>
                </div>
            `).join('');
        }

        // Form gönder
        document.getElementById('productForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const newProduct = {
                id: Date.now(),
                name: document.getElementById('productName').value,
                price: parseInt(document.getElementById('productPrice').value),
                description: document.getElementById('productDescription').value,
                category: document.getElementById('productCategory').value,
                stock: parseInt(document.getElementById('productStock').value),
                image: document.getElementById('productImage').value || '📦'
            };

            products.push(newProduct);
            saveProducts();
            document.getElementById('productForm').reset();
            displayProducts();
            alert('Ürün başarıyla eklendi!');
        });

        // Ürün sil
        function deleteProduct(id) {
            if (confirm('Bu ürünü silmek istediğinize emin misiniz?')) {
                products = products.filter(p => p.id !== id);
                saveProducts();
                displayProducts();
                alert('Ürün silindi!');
            }
        }

        // Ürünleri kaydet (LocalStorage)
        function saveProducts() {
            localStorage.setItem('products', JSON.stringify(products));
        }

        // Başlat
        loadProducts();
    </script>
</body>
</html>
